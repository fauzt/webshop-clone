name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest

    # A real Postgres instance for the duration of this job, matching the
    # "real database, not mocks" approach the test suite itself uses. GitHub
    # Actions maps this service's port 5432 onto the runner's own localhost,
    # so DATABASE_URL below can point straight at localhost.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_bookstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./server/

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_bookstore
      JWT_ACCESS_SECRET: test-secret-for-ci-only
      NODE_ENV: test
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - run: npx prisma generate

      - name: Run tests
        run: npx vitest run

  test-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client/

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npx vitest run


