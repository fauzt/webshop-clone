name: Lint code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-js-backend:
    name: Lint JavaScript Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache-dependency-path: server/package-lock.json
          node-version: 24
          cache: 'npm'

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.ts') }}
          restore-keys: |
            eslint-${{ hashFiles('**/package-lock.json') }}-
            eslint-

      - run: npm ci

      - name: ESLint
        run: npx eslint ./src/ --ext .js,.jsx --cache --cache-location .eslintcache --max-warnings 0

      - name: Prettier
        run: npx prettier --check "./src/**/*.{js,jsx,json,css,md}"